<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Sukh, open this</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #fff0f6;
    --bg-2: #ffd93d;
    --ink: #24122b;
    --ink-soft: #7a4a6e;
    --accent: #ff2d78;
    --accent-2: #ffcc00;
    --accent-3: #7c3aed;
    --accent-4: #00c2a8;
    --card: #fffdf9;
    --card-border: #ffd6e8;
    --shadow: rgba(124,58,237,0.25);
    --btn-yes-text: #fffdf9;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #1b0f22; --bg-2: #341a3d; --ink: #fce9f7; --ink-soft: #d79cc4;
      --accent: #ff5c93; --accent-2: #ffdd55; --accent-3: #a374ff; --accent-4: #2fe0c4;
      --card: #241430; --card-border: #45254f; --shadow: rgba(0,0,0,0.5); --btn-yes-text: #1b0f22;
    }
  }
  :root[data-theme="dark"]{
    --bg: #1b0f22; --bg-2: #341a3d; --ink: #fce9f7; --ink-soft: #d79cc4;
    --accent: #ff5c93; --accent-2: #ffdd55; --accent-3: #a374ff; --accent-4: #2fe0c4;
    --card: #241430; --card-border: #45254f; --shadow: rgba(0,0,0,0.5); --btn-yes-text: #1b0f22;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0; min-height:100vh; overflow-x: hidden;
    background: linear-gradient(120deg, var(--bg), var(--bg-2), var(--accent-3), var(--bg));
    background-size: 300% 300%;
    animation: gradientShift 10s ease infinite;
    color: var(--ink); font-family: 'Quicksand', sans-serif;
    display:flex; align-items:center; justify-content:center; padding: 24px; position: relative;
  }
  @keyframes gradientShift{
    0%{ background-position: 0% 50%; }
    50%{ background-position: 100% 50%; }
    100%{ background-position: 0% 50%; }
  }

  .rain{ position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .rain span{
    position: absolute; top: -40px; animation: rainFall linear infinite;
  }
  @keyframes rainFall{
    to{ transform: translateY(110vh) rotate(360deg); }
  }

  .bg-shapes{ position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .bg-shapes span{
    position: absolute; font-size: 22px; opacity: 0.25;
    animation: drift 9s ease-in-out infinite;
  }
  @keyframes drift{
    0%,100%{ transform: translateY(0) rotate(0deg); }
    50%{ transform: translateY(-18px) rotate(8deg); }
  }

  .card{
    position: relative; z-index: 1; max-width: 460px; width: 100%;
    background: var(--card); border: 3px solid var(--card-border);
    border-radius: 30px; padding: clamp(30px, 7vw, 50px) clamp(24px, 6vw, 40px);
    text-align: center; box-shadow: 0 30px 65px var(--shadow);
    transition: transform 0.4s ease;
    min-height: 340px;
    display: flex; flex-direction: column; justify-content: center;
    animation: idleWiggle 4.5s ease-in-out infinite;
  }
  @keyframes idleWiggle{
    0%,100%{ transform: rotate(-0.6deg) scale(1); }
    50%{ transform: rotate(0.6deg) scale(1.008); }
  }
  .card.shake-card{ animation: cardShake 0.5s ease; }
  @keyframes cardShake{
    0%,100%{ transform: translateX(0); }
    20%{ transform: translateX(-8px); }
    40%{ transform: translateX(7px); }
    60%{ transform: translateX(-5px); }
    80%{ transform: translateX(3px); }
  }

  .screen{ display: none; }
  .screen.active{ display: block; animation: fadeUp 0.45s ease both; }
  @keyframes fadeUp{
    from{ opacity: 0; transform: translateY(10px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  .progress{ display:flex; gap: 5px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
  .progress span{ width: 8px; height: 8px; border-radius: 50%; background: var(--card-border); transition: background 0.3s ease, transform 0.3s ease; }
  .progress span.done{ background: var(--accent); animation: dotPop 0.4s ease; }
  @keyframes dotPop{ 0%{ transform: scale(0.4); } 60%{ transform: scale(1.4); } 100%{ transform: scale(1); } }

  .kicker{ font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 16px; color: var(--accent-3); margin: 0 0 8px; }
  h1{ font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: clamp(26px, 6vw, 38px); line-height: 1.15; margin: 0 0 12px; color: var(--accent); }
  p.body-text{ color: var(--ink-soft); font-size: 15px; line-height: 1.6; margin: 0 0 8px; max-width: 34ch; margin-left:auto; margin-right:auto; font-weight: 600; }

  .quiz-options{ display:flex; flex-direction: column; gap: 10px; margin-top: 18px; }
  .quiz-options button{
    font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 15px;
    border-radius: 14px; border: 2.5px solid var(--card-border); background: transparent;
    color: var(--ink); padding: 13px 16px; cursor: pointer; transition: all 0.15s ease;
  }
  .quiz-options button:hover{ border-color: var(--accent); background: rgba(255,45,120,0.1); transform: scale(1.03) rotate(-1deg); }
  .quiz-reply{ margin-top: 14px; font-size: 14px; color: var(--accent); font-weight: 800; min-height: 20px; }

  .meme-card{
    position: relative; background: linear-gradient(135deg, var(--accent), var(--accent-3), var(--accent-4));
    background-size: 200% 200%;
    animation: memeGradient 3s ease infinite;
    border-radius: 18px; padding: 44px 14px; margin: 12px 0 4px; min-height: 170px;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  @keyframes memeGradient{
    0%{ background-position: 0% 50%; } 50%{ background-position: 100% 50%; } 100%{ background-position: 0% 50%; }
  }
  .meme-emoji{ font-size: 60px; filter: drop-shadow(0 6px 10px rgba(0,0,0,0.25)); display:inline-block; animation: emojiWiggle 1.6s ease-in-out infinite; }
  @keyframes emojiWiggle{
    0%,100%{ transform: rotate(-8deg) scale(1); }
    50%{ transform: rotate(8deg) scale(1.08); }
  }
  .meme-caption{
    position:absolute; left:8px; right:8px; font-family: 'Arial Black', Arial, sans-serif;
    font-weight:900; text-transform:uppercase; color:#fff; font-size: 14px; line-height:1.25;
    text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0 0 6px rgba(0,0,0,0.35);
    text-align:center;
  }
  .meme-caption.top{ top:10px; }
  .meme-caption.bottom{ bottom:10px; }

  .meme2-row{ display:flex; gap: 10px; margin: 12px 0 4px; }
  .meme2-panel{ flex:1; }
  .meme2-panel .meme-card{ min-height: 140px; padding: 30px 8px; margin: 6px 0; }
  .meme2-label{ font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 4px; }

  .tap-wrap{ margin-top: 10px; }
  .tap-heart{
    font-size: 64px; cursor: pointer; user-select: none; -webkit-user-select: none;
    transition: transform 0.15s ease; display: inline-block;
  }
  .tap-heart:active{ transform: scale(0.85); }
  .tap-count{ margin-top: 10px; font-weight: 800; font-size: 20px; color: var(--accent); }
  .tap-hint{ margin-top: 4px; font-size: 13px; color: var(--ink-soft); }
  .tap-particle{
    position: fixed; pointer-events: none; font-size: 20px; z-index: 6;
    animation: tapFloat 0.9s ease-out forwards;
  }
  @keyframes tapFloat{
    to{ transform: translateY(-70px) scale(1.3); opacity: 0; }
  }

  .slide-actions{ margin-top: 22px; }
  #slideNext{
    font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 16px;
    border: none; border-radius: 999px; background: var(--accent); color: var(--btn-yes-text);
    padding: 13px 30px; cursor: pointer; transition: transform 0.2s ease;
    animation: pulseHappy 1.4s ease-in-out infinite;
  }
  #slideNext:hover{ transform: translateY(-2px) scale(1.05); }
  #slideNext.hidden{ display: none; }

  .buttons{ position:relative; display:flex; gap: 16px; justify-content:center; align-items:center; flex-wrap: wrap; min-height: 130px; margin-top: 6px; }
  button.main-btn{
    font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 18px;
    border-radius: 999px; border: none; cursor: pointer; padding: 17px 32px;
    transition: transform 0.35s cubic-bezier(.2,1.4,.4,1), font-size 0.35s ease, padding 0.35s ease;
    animation: btnBreathe 2.2s ease-in-out infinite;
  }
  @keyframes btnBreathe{
    0%,100%{ transform: scale(1); }
    50%{ transform: scale(1.035); }
  }
  #yes{ background: var(--accent); color: var(--btn-yes-text); box-shadow: 0 12px 24px -8px var(--accent); }
  #yes:hover{ transform: translateY(-2px) scale(1.05); }
  #yes.pulse-happy{ animation: pulseHappy 0.7s ease-in-out infinite; }
  @keyframes pulseHappy{
    0%,100%{ transform: scale(1); box-shadow: 0 0 0 0 rgba(255,45,120,0.5); }
    50%{ transform: scale(1.1); box-shadow: 0 0 0 18px rgba(255,45,120,0); }
  }
  #no{ background: transparent; color: var(--ink-soft); border: 2.5px solid var(--card-border); }
  #no.fixed-pos{ position: fixed; z-index: 5; }
  #no.wobble-sad{ animation: wobbleSad 0.85s ease-in-out infinite; filter: grayscale(35%) opacity(0.8); }
  @keyframes wobbleSad{
    0%,100%{ transform: rotate(0deg) translateY(0); }
    25%{ transform: rotate(-5deg) translateY(2px); }
    75%{ transform: rotate(5deg) translateY(2px); }
  }
  @keyframes shake{
    0%,100%{ transform: translateX(0) rotate(0deg) scale(1); }
    20%{ transform: translateX(-9px) rotate(-14deg) scale(0.95); }
    40%{ transform: translateX(8px) rotate(12deg) scale(1.05); }
    60%{ transform: translateX(-6px) rotate(-9deg) scale(0.97); }
    80%{ transform: translateX(4px) rotate(6deg) scale(1); }
  }
  #no.shake{ animation: shake 0.35s ease; }
  #no.gone{ animation: popGone 0.4s ease forwards; }
  @keyframes popGone{ to{ transform: scale(0) rotate(180deg); opacity: 0; } }

  .decoy-no{
    position: fixed; z-index: 5; font-family: 'Quicksand', sans-serif; font-weight: 800; font-size: 14px;
    border-radius: 999px; border: 2px dashed var(--card-border); background: var(--card); color: var(--ink-soft);
    padding: 11px 20px; cursor: pointer; animation: decoyIn 0.3s ease both;
  }
  @keyframes decoyIn{ from{ transform: scale(0.5); opacity: 0; } to{ transform: scale(1); opacity: 1; } }

  .caption{ margin-top: 18px; font-size: 14px; color: var(--ink-soft); min-height: 20px; }

  .bubble{
    position: fixed; z-index: 6; max-width: 210px; padding: 10px 14px; border-radius: 14px;
    font-size: 13px; line-height: 1.45; text-align: left; font-family: 'Quicksand', sans-serif; font-weight: 600;
    background: var(--card); border: 1px solid var(--accent); color: var(--ink);
    box-shadow: 0 14px 30px var(--shadow); opacity: 0; transform: translateY(6px) scale(0.95); pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .bubble.show{ opacity: 1; transform: translateY(0) scale(1); }

  .mood-emoji{
    position: fixed; pointer-events: none; font-size: 28px; z-index: 6; opacity: 0;
    transform: translate(-50%, -50%) scale(0.7); transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .mood-emoji.show{ opacity: 1; transform: translate(-50%, -50%) scale(1); }

  @keyframes bounceIn{
    0%{ transform: scale(0.6); opacity: 0; }
    55%{ transform: scale(1.1); opacity: 1; }
    75%{ transform: scale(0.95); }
    100%{ transform: scale(1); }
  }
  #screen-result.active h1, #screen-result.active .kicker, #screen-result.active .body-text{
    animation: bounceIn 0.6s cubic-bezier(.2,1.6,.4,1) both;
  }
  #screen-result.active .body-text{ animation-delay: 0.1s; }

  .hearts{ position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 4; }
  .hearts span{ position: absolute; top: -40px; font-size: 22px; animation: fall linear forwards; }
  @keyframes fall{ to{ transform: translateY(110vh) rotate(360deg); opacity: 0.9; } }
  .confetti-piece{ position: absolute; top: -20px; width: 9px; height: 16px; opacity: 0.95; animation: confettiFall linear forwards; }
  @keyframes confettiFall{ to{ transform: translateY(110vh) rotate(780deg); opacity: 0.8; } }
  .burst-item{ position: fixed; left: 50%; top: 50%; z-index: 7; font-size: 24px; pointer-events: none; animation: burstOut 1.15s cubic-bezier(.15,.7,.3,1) forwards; }
  @keyframes burstOut{
    0%{ transform: translate(-50%,-50%) scale(0.4); opacity: 1; }
    100%{ transform: translate(var(--bx), var(--by)) scale(1.1); opacity: 0; }
  }
  .pop-confetti{ position: fixed; z-index: 7; pointer-events: none; width: 8px; height: 14px; animation: popConfetti 0.9s ease-out forwards; }
  @keyframes popConfetti{ to{ transform: translate(var(--px), var(--py)) rotate(400deg); opacity: 0; } }

  .actions-row{ display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 18px; }
  .notify-btn, .cert-btn{
    display: inline-flex; align-items: center; gap: 8px; font-family: 'Quicksand', sans-serif; font-weight: 700;
    font-size: 14px; border: none; border-radius: 999px; padding: 13px 24px; cursor: pointer; text-decoration: none;
  }
  .notify-btn{ background: #25D366; color: #fff; }
  .cert-btn{ background: var(--accent-3); color: #fff; }
  .notify-btn:hover, .cert-btn:hover{ opacity: 0.9; }
  .notify-note{ font-size: 12px; color: var(--ink-soft); min-height: 16px; }
  .notify-note.sent{ color: var(--accent); }

  @media (prefers-reduced-motion: reduce){
    .screen.active, #screen-result.active h1, #screen-result.active .kicker, #screen-result.active .body-text,
    #yes.pulse-happy, #no.wobble-sad, #no.shake, .bg-shapes span, .hearts span, .card.shake-card{ animation: none; }
  }
</style>
</head>
<body>

<div class="bg-shapes" id="bgShapes"></div>
<div class="rain" id="rain"></div>

<div class="card" id="card">

  <div class="screen active" id="screen-slides">
    <div class="progress" id="progress"></div>
    <div id="slideContent"></div>
    <div class="slide-actions">
      <button id="slideNext">Continue →</button>
    </div>
  </div>

  <div class="screen" id="screen-question">
    <p class="kicker">for Sukh</p>
    <h1>Will you marry me?</h1>
    <p class="body-text">Take your time. Well — take as much time as you want, as long as the answer ends up being yes.</p>
    <div class="buttons">
      <button class="main-btn" id="yes" onclick="sayYes()">Yes</button>
      <button class="main-btn" id="no" onclick="dodge()" onmouseenter="dodge()" ontouchstart="dodgeTouch(event)">No</button>
    </div>
    <p class="caption" id="caption">&nbsp;</p>
  </div>

  <div class="screen" id="screen-result">
    <p class="kicker">it's official</p>
    <h1>Yes! 🎉</h1>
    <p class="body-text">Somehow the No button — and its clones — didn't stand a chance either.</p>
    <div class="actions-row">
      <a class="notify-btn" id="notifyBtn" href="#" target="_blank" rel="noopener">Let him know 💬</a>
      <p class="notify-note" id="notifyNote">&nbsp;</p>
      <button class="cert-btn" id="certBtn" onclick="downloadCertificate()">Save this moment 🖼️</button>
    </div>
  </div>

</div>

<div class="hearts" id="hearts"></div>
<div class="mood-emoji" id="moodEmoji"></div>
<div class="bubble" id="bubble"></div>
<canvas id="certCanvas" width="1000" height="620" style="display:none;"></canvas>

<script>
  /* ---------- background doodles ---------- */
  const shapeLayer = document.getElementById('bgShapes');
  const shapeChars = ['♡','✦','✧','♡','·','🎉'];
  const positions = [
    {t:'8%', l:'10%'}, {t:'18%', l:'85%'}, {t:'70%', l:'6%'},
    {t:'85%', l:'80%'}, {t:'45%', l:'92%'}, {t:'55%', l:'3%'}, {t:'30%', l:'50%'}
  ];
  positions.forEach((p, i) => {
    const s = document.createElement('span');
    s.textContent = shapeChars[i % shapeChars.length];
    s.style.top = p.t; s.style.left = p.l;
    s.style.animationDelay = (i * 0.6) + 's';
    shapeLayer.appendChild(s);
  });

  /* ---------- continuous background rain ---------- */
  const rainLayer = document.getElementById('rain');
  const rainItems = ['🎉','✨','💖','🎊','💫','⭐'];
  const rainColors = ['#ff2d78', '#ffcc00', '#7c3aed', '#00c2a8'];
  function spawnRainPiece(){
    const useEmoji = Math.random() > 0.4;
    const el = document.createElement('span');
    if (useEmoji){
      el.textContent = rainItems[Math.floor(Math.random() * rainItems.length)];
      el.style.fontSize = (14 + Math.random() * 14) + 'px';
    } else {
      el.style.width = '7px'; el.style.height = '13px'; el.style.display = 'inline-block';
      el.style.background = rainColors[Math.floor(Math.random() * rainColors.length)];
      el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    }
    el.style.left = Math.random() * 100 + 'vw';
    const dur = 5 + Math.random() * 5;
    el.style.animationDuration = dur + 's';
    el.style.opacity = 0.55 + Math.random() * 0.3;
    rainLayer.appendChild(el);
    setTimeout(() => el.remove(), dur * 1000 + 200);
  }
  for (let i = 0; i < 14; i++){ setTimeout(spawnRainPiece, i * 250); }
  setInterval(spawnRainPiece, 550);

  /* ---------- story / meme / quiz / tap slides ---------- */
  const slides = [
    { type: 'text', kicker: 'a quick warning', title: 'This is not a normal message.', body: "Keep scrolling. I promise it's worth it." },
    { type: 'meme', top: "ME, TRYING TO ACT NORMAL", emoji: '😅', bottom: "WHILE PLANNING THIS ENTIRE PAGE" },
    { type: 'text', kicker: 'fun fact', title: "You've survived my cooking, my jokes, and my 2am voice notes.", body: "That's basically a compatibility test. You passed." },
    { type: 'quiz', kicker: 'quick quiz before we continue', title: 'Who takes longer to reply to texts?', options: ['Me', 'Also me', 'Definitely me'], replies: ["Correct. Somehow we still work.", "Called it.", "Accurate, and yet you stayed."] },
    { type: 'meme2',
      left: { label: 'expectation', emoji: '💐', caption: 'A SMOOTH, CONFIDENT PROPOSAL' },
      right: { label: 'reality', emoji: '😬', caption: 'A WEBSITE WITH A DODGING BUTTON' }
    },
    { type: 'quiz', kicker: 'rate my texting game', title: 'Be honest.', options: ['10/10', 'Needs work, but iconic', 'Chaotic but loveable'], replies: ["Correct answer.", "Fair. Continuing anyway.", "Also correct."] },
    { type: 'tap', kicker: 'quick task', title: 'Tap this heart to show how much I like you.', target: 15, doneText: "Okay that's basically infinite. Moving on." },
    { type: 'text', kicker: 'so,', title: "I've been thinking about something.", body: 'One question, actually. Ready?' }
  ];
  let slideIndex = 0;
  const progressEl = document.getElementById('progress');
  slides.forEach(() => { progressEl.appendChild(document.createElement('span')); });

  function renderSlide(){
    const s = slides[slideIndex];
    const content = document.getElementById('slideContent');
    const nextBtn = document.getElementById('slideNext');
    [...progressEl.children].forEach((d, i) => d.classList.toggle('done', i <= slideIndex));
    nextBtn.classList.remove('hidden');

    if (s.type === 'text'){
      content.innerHTML =
        '<p class="kicker">' + s.kicker + '</p>' +
        '<h1>' + s.title + '</h1>' +
        '<p class="body-text">' + s.body + '</p>';
      nextBtn.textContent = slideIndex === slides.length - 1 ? "Okay, ask me →" : 'Continue →';

    } else if (s.type === 'meme'){
      content.innerHTML =
        '<div class="meme-card">' +
          '<span class="meme-caption top">' + s.top + '</span>' +
          '<span class="meme-emoji">' + s.emoji + '</span>' +
          '<span class="meme-caption bottom">' + s.bottom + '</span>' +
        '</div>';
      nextBtn.textContent = 'Continue →';

    } else if (s.type === 'meme2'){
      content.innerHTML =
        '<div class="meme2-row">' +
          '<div class="meme2-panel"><div class="meme2-label">' + s.left.label + '</div>' +
            '<div class="meme-card"><span class="meme-emoji">' + s.left.emoji + '</span>' +
            '<span class="meme-caption bottom">' + s.left.caption + '</span></div></div>' +
          '<div class="meme2-panel"><div class="meme2-label">' + s.right.label + '</div>' +
            '<div class="meme-card"><span class="meme-emoji">' + s.right.emoji + '</span>' +
            '<span class="meme-caption bottom">' + s.right.caption + '</span></div></div>' +
        '</div>';
      nextBtn.textContent = 'Continue →';

    } else if (s.type === 'quiz'){
      content.innerHTML =
        '<p class="kicker">' + s.kicker + '</p>' +
        '<h1>' + s.title + '</h1>' +
        '<div class="quiz-options" id="quizOptions"></div>' +
        '<p class="quiz-reply" id="quizReply">&nbsp;</p>';
      const optWrap = document.getElementById('quizOptions');
      s.options.forEach((opt, i) => {
        const b = document.createElement('button');
        b.textContent = opt;
        b.onclick = () => {
          playPopSound();
          document.getElementById('quizReply').textContent = s.replies[i];
          [...optWrap.children].forEach(c => c.disabled = true);
          setTimeout(() => { slideIndex++; renderSlide(); }, 950);
        };
        optWrap.appendChild(b);
      });
      nextBtn.classList.add('hidden');

    } else if (s.type === 'tap'){
      content.innerHTML =
        '<p class="kicker">' + s.kicker + '</p>' +
        '<h1>' + s.title + '</h1>' +
        '<div class="tap-wrap">' +
          '<div class="tap-heart" id="tapHeart">💗</div>' +
          '<div class="tap-count" id="tapCount">0</div>' +
          '<div class="tap-hint">tap it a bunch of times</div>' +
        '</div>';
      nextBtn.classList.add('hidden');
      let tapCount = 0;
      const heart = document.getElementById('tapHeart');
      const countEl = document.getElementById('tapCount');
      heart.addEventListener('click', (e) => {
        playPopSound();
        tapCount++;
        countEl.textContent = tapCount;
        const p = document.createElement('div');
        p.className = 'tap-particle';
        p.textContent = ['💗','✨','💕'][tapCount % 3];
        const r = heart.getBoundingClientRect();
        p.style.left = (r.left + r.width / 2 + (Math.random() * 40 - 20)) + 'px';
        p.style.top = r.top + 'px';
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 900);
        if (tapCount === 1){ heart.style.fontSize = '70px'; }
        if (tapCount >= s.target){
          document.querySelector('.tap-hint').textContent = s.doneText;
          heart.style.pointerEvents = 'none';
          setTimeout(() => { slideIndex++; renderSlide(); }, 900);
        }
      });

    }
  }
  document.getElementById('slideNext').addEventListener('click', () => {
    playPopSound();
    slideIndex++;
    if (slideIndex >= slides.length){
      document.getElementById('screen-slides').classList.remove('active');
      document.getElementById('screen-question').classList.add('active');
    } else {
      renderSlide();
    }
  });
  renderSlide();

  function popAudioCtx(){
    if (!window._ac){ try{ window._ac = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; } }
    return window._ac;
  }
  function playPopSound(){
    const ac = popAudioCtx(); if (!ac) return;
    try{
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'triangle'; o.frequency.value = 500; g.gain.value = 0.1;
      o.connect(g); g.connect(ac.destination); o.start();
      o.frequency.exponentialRampToValueAtTime(800, ac.currentTime + 0.1);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.12);
      o.stop(ac.currentTime + 0.14);
    }catch(e){}
  }

  /* ---------- proposal logic ---------- */
  const cardEl = document.getElementById('card');
  const noBtn = document.getElementById('no');
  const yesBtn = document.getElementById('yes');
  const caption = document.getElementById('caption');
  const bubble = document.getElementById('bubble');
  const captions = [
    "nice try.", "the button says no to that.", "still no luck.", "it's getting shy.",
    "okay it's just avoiding you now.", "at this point it's basically exercise.",
    "wait, why though? 🥺", "it's really considering giving up..."
  ];
  const decoyLines = ["nope, this one's fake too.", "that one doesn't count either.", "still not the real no.", "decoy. try again."];
  let dodgeCount = 0, placed = false, noGone = false;

  function audioCtx(){
    if (!window._ac){ try{ window._ac = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; } }
    return window._ac;
  }
  function playTone(freq, dur, type, gain){
    const ac = audioCtx(); if (!ac) return;
    try{
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type || 'sine'; o.frequency.value = freq; g.gain.value = gain || 0.11;
      o.connect(g); g.connect(ac.destination); o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
      o.stop(ac.currentTime + dur + 0.02);
    }catch(e){}
  }
  function playDodgeSound(n){ playTone(360 + Math.min(n, 10) * 16, 0.15, 'sine', 0.09); }
  function playDecoySound(){ playTone(220, 0.1, 'square', 0.06); }
  function playGiveUpSound(){
    [300, 240, 180].forEach((f, i) => setTimeout(() => playTone(f, 0.22, 'triangle', 0.1), i * 110));
  }
  function playYesSound(){
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => setTimeout(() => playTone(f, 0.32, 'sine', 0.13), i * 120));
  }

  function showBubble(text){
    bubble.textContent = text;
    const r = noBtn.getBoundingClientRect();
    let x = r.left + r.width / 2 - 105;
    x = Math.max(8, Math.min(window.innerWidth - 218, x));
    let y = r.top - 66;
    if (y < 8) y = r.bottom + 10;
    bubble.style.left = x + 'px'; bubble.style.top = y + 'px';
    bubble.classList.add('show');
    clearTimeout(window._bt);
    window._bt = setTimeout(() => bubble.classList.remove('show'), 1400);
  }

  function spawnDecoy(){
    const d = document.createElement('button');
    d.className = 'decoy-no';
    d.textContent = 'No';
    const margin = 16;
    const x = margin + Math.random() * (window.innerWidth - 140);
    const y = margin + Math.random() * (window.innerHeight - 80);
    d.style.left = x + 'px'; d.style.top = y + 'px';
    d.onclick = () => {
      caption.textContent = decoyLines[Math.floor(Math.random() * decoyLines.length)];
      playDecoySound();
      d.remove();
    };
    document.body.appendChild(d);
    setTimeout(() => { if (d.parentNode) d.remove(); }, 2200);
  }

  function popNoAway(){
    noGone = true;
    const r = noBtn.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const colors = ['#ff2d78', '#ffcc00', '#7c3aed', '#00c2a8'];
    for (let i = 0; i < 24; i++){
      const p = document.createElement('div');
      p.className = 'pop-confetti';
      p.style.left = cx + 'px'; p.style.top = cy + 'px';
      p.style.background = colors[i % colors.length];
      const angle = Math.random() * Math.PI * 2;
      const dist = 60 + Math.random() * 130;
      p.style.setProperty('--px', Math.cos(angle) * dist + 'px');
      p.style.setProperty('--py', Math.sin(angle) * dist + 'px');
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 1000);
    }
    noBtn.classList.add('gone');
    cardEl.classList.remove('shake-card'); void cardEl.offsetWidth; cardEl.classList.add('shake-card');
    playGiveUpSound();
    caption.textContent = "the No button — and all its clones — have left the chat. only Yes remains.";
    setTimeout(() => { noBtn.style.display = 'none'; }, 380);
  }

  function dodge(){
    if (noGone) return;
    dodgeCount++;
    if (dodgeCount >= 8){ popNoAway(); return; }
    if (!placed){
      const r = noBtn.getBoundingClientRect();
      noBtn.style.width = r.width + 'px';
      noBtn.classList.add('fixed-pos');
      placed = true;
    }
    const margin = 16, w = noBtn.offsetWidth, h = noBtn.offsetHeight;
    const maxX = window.innerWidth - w - margin, maxY = window.innerHeight - h - margin;
    noBtn.style.left = (margin + Math.random() * Math.max(0, maxX - margin)) + 'px';
    noBtn.style.top = (margin + Math.random() * Math.max(0, maxY - margin)) + 'px';
    const shrink = Math.max(0.55, 1 - dodgeCount * 0.045);
    noBtn.style.fontSize = (17 * shrink) + 'px';
    noBtn.style.padding = (16 * shrink) + 'px ' + (30 * shrink) + 'px';
    yesBtn.style.fontSize = Math.min(26, 17 + dodgeCount * 0.6) + 'px';
    yesBtn.style.padding = Math.min(24, 16 + dodgeCount * 0.5) + 'px ' + Math.min(44, 30 + dodgeCount * 0.9) + 'px';
    const text = captions[Math.min(dodgeCount - 1, captions.length - 1)];
    caption.textContent = text;
    noBtn.classList.remove('shake'); void noBtn.offsetWidth; noBtn.classList.add('shake');
    showBubble(text);
    playDodgeSound(dodgeCount);
    if (dodgeCount === 2 || dodgeCount === 4 || dodgeCount === 6){ spawnDecoy(); }
  }
  function dodgeTouch(e){ e.preventDefault(); dodge(); }

  /* ---------- proximity mood ---------- */
  const moodEmoji = document.getElementById('moodEmoji');
  let moodTicking = false;
  function updateMood(x, y){
    if (!document.getElementById('screen-question').classList.contains('active')) return;
    const yr = yesBtn.getBoundingClientRect();
    const yc = { x: yr.left + yr.width / 2, y: yr.top + yr.height / 2 };
    const dy = Math.hypot(x - yc.x, y - yc.y);
    const threshold = 130;
    if (dy < threshold){
      yesBtn.classList.add('pulse-happy');
      moodEmoji.textContent = '🤩';
      moodEmoji.style.left = yc.x + 'px'; moodEmoji.style.top = (yc.y - 58) + 'px';
      moodEmoji.classList.add('show');
    } else {
      yesBtn.classList.remove('pulse-happy');
    }
    if (!noGone){
      const nr = noBtn.getBoundingClientRect();
      const nc = { x: nr.left + nr.width / 2, y: nr.top + nr.height / 2 };
      const dn = Math.hypot(x - nc.x, y - nc.y);
      if (dn < threshold){
        noBtn.classList.add('wobble-sad');
        moodEmoji.textContent = '😢';
        moodEmoji.style.left = nc.x + 'px'; moodEmoji.style.top = (nc.y - 58) + 'px';
        moodEmoji.classList.add('show');
      } else {
        noBtn.classList.remove('wobble-sad');
      }
      if (dy >= threshold && dn >= threshold) moodEmoji.classList.remove('show');
    } else if (dy >= threshold){
      moodEmoji.classList.remove('show');
    }
  }
  function moodFromEvent(e){
    if (moodTicking) return;
    moodTicking = true;
    const point = e.touches ? e.touches[0] : e;
    requestAnimationFrame(() => { updateMood(point.clientX, point.clientY); moodTicking = false; });
  }
  document.addEventListener('mousemove', moodFromEvent);
  document.addEventListener('touchmove', moodFromEvent, { passive: true });

  /* ---------- yes / celebration ---------- */
  function sayYes(){
    document.getElementById('screen-question').classList.remove('active');
    document.getElementById('screen-result').classList.add('active');
    bubble.classList.remove('show');
    moodEmoji.classList.remove('show');
    yesBtn.classList.remove('pulse-happy');
    const waMsg = encodeURIComponent("YES!! 🎉 My answer is YES!");
    const notifyBtn = document.getElementById('notifyBtn');
    const notifyNote = document.getElementById('notifyNote');
    notifyBtn.href = 'https://wa.me/917508445747?text=' + waMsg;
    notifyBtn.addEventListener('click', () => {
      notifyNote.textContent = 'sent! go check your phone 📱';
      notifyNote.classList.add('sent');
    });
    launchHearts();
    launchConfetti();
    launchBurst();
    playYesSound();
  }
  function launchHearts(){
    const layer = document.getElementById('hearts');
    const emojis = ['💛','💕','✨','💌'];
    for (let i = 0; i < 36; i++){
      const s = document.createElement('span');
      s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      s.style.left = Math.random() * 100 + 'vw';
      s.style.animationDuration = (2.4 + Math.random()*2.4) + 's';
      s.style.animationDelay = (Math.random()*1.1) + 's';
      s.style.fontSize = (16 + Math.random()*16) + 'px';
      layer.appendChild(s);
      setTimeout(() => s.remove(), 6000);
    }
  }
  function launchConfetti(){
    const layer = document.getElementById('hearts');
    const colors = ['#ff2d78', '#ffcc00', '#7c3aed', '#00c2a8'];
    for (let i = 0; i < 60; i++){
      const c = document.createElement('div');
      c.className = 'confetti-piece';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      c.style.animationDuration = (2.2 + Math.random() * 2) + 's';
      c.style.animationDelay = (Math.random() * 0.8) + 's';
      layer.appendChild(c);
      setTimeout(() => c.remove(), 5200);
    }
  }
  function launchBurst(){
    const emojis = ['🥳','🙌','💍','🎊','✨'];
    for (let i = 0; i < 20; i++){
      const b = document.createElement('div');
      b.className = 'burst-item';
      b.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      const angle = Math.random() * Math.PI * 2;
      const dist = 140 + Math.random() * 190;
      b.style.setProperty('--bx', 'calc(-50% + ' + Math.cos(angle) * dist + 'px)');
      b.style.setProperty('--by', 'calc(-50% + ' + Math.sin(angle) * dist + 'px)');
      b.style.animationDelay = (Math.random() * 0.3) + 's';
      document.body.appendChild(b);
      setTimeout(() => b.remove(), 1550);
    }
  }

  /* ---------- certificate download ---------- */
  function downloadCertificate(){
    const canvas = document.getElementById('certCanvas');
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    ctx.fillStyle = '#fff1ee'; ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = '#ff2d78'; ctx.lineWidth = 6; ctx.strokeRect(24, 24, w - 48, h - 48);
    ctx.strokeStyle = '#7c3aed'; ctx.lineWidth = 2; ctx.strokeRect(38, 38, w - 76, h - 76);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#7c3aed';
    ctx.font = 'italic 26px Georgia';
    ctx.fillText('Certificate of an Excellent Decision', w/2, 150);
    ctx.fillStyle = '#2c1b22';
    ctx.font = 'bold 64px Georgia';
    ctx.fillText('She said YES', w/2, 270);
    ctx.font = '26px Georgia';
    ctx.fillStyle = '#7a5a63';
    ctx.fillText('Sukh officially said yes to forever.', w/2, 340);
    const d = new Date();
    ctx.font = '20px Georgia';
    ctx.fillText(d.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' }), w/2, 400);
    ctx.font = '48px Georgia';
    ctx.fillText('🎉 💍 🎉', w/2, 480);
    ctx.font = 'italic 18px Georgia';
    ctx.fillStyle = '#ff2d78';
    ctx.fillText('this certificate is 100% legally unenforceable but 100% real', w/2, 550);

    const link = document.createElement('a');
    link.download = 'sukh-said-yes.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }
</script>
